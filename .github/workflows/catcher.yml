name: OCI ARM Instance Catcher (Aggressive Loop)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Sproži se na vsake 4 ure

jobs:
  launch-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # Teče do 5 ur
    steps:
      - name: Namestitev OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Konfiguracija OCI profilnih podatkov
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          key_file=~/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          EOF
          chmod 600 ~/.oci/config

      - name: Lovljenje ARM instance (zanka na 30 sekund)
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          echo "$SSH_KEY" > ~/.ssh_authorized_keys

          IMAGE_ID=$(oci compute image list \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --operating-system "Canonical Ubuntu" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED --sort-order DESC \
            --query "data[0].id" --raw-output)

          echo "Uporabljam sliko: $IMAGE_ID"

          # Začetek 5-urne zanke
          END_TIME=$((SECONDS + 17500)) # ~4.8 ur
          POSKUS=1

          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- Poskus #$POSKUS ($(date '+%H:%M:%S')) ---"
            
            # Preverimo, če je morda že ustvarjena
            RUNNING=$(oci compute instance list \
              --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
              --lifecycle-state RUNNING \
              --query "data[?\"lifecycle-state\"=='RUNNING'].id" \
              --raw-output)

            if [ "$RUNNING" != "[]" ] && [ -n "$RUNNING" ]; then
              echo "🎉 INSTANCA ŽE TEČE! Ustavljam zanko."
              exit 0
            fi

            # Pošljemo zahtevek
            OUTPUT=$(oci compute instance launch \
              --availability-domain "oNUv:eu-amsterdam-1-AD-1" \
              --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
              --image-id "$IMAGE_ID" \
              --subnet-id "ocid1.subnet.oc1.eu-amsterdam-1.aaaaaaaa7jcqkfmxpr5xiprgob6ah7lunqw67i3dnkyrdck3pupcjhsawj7a" \
              --assign-public-ip true \
              --display-name "moj-arm-streznik" \
              --ssh-authorized-keys-file ~/.ssh_authorized_keys \
              --boot-volume-size-in-gbs 50 2>&1) || true

            if echo "$OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "🎉 USPEH! Strežnik je bil uspešno ustvarjen!"
              exit 0
            elif echo "$OUTPUT" | grep -q "OutOfHostCapacity"; then
              echo "Status: Out of host capacity (zasedeno). Čakam 30 sekund..."
            else
              echo "Odziv: $OUTPUT"
            fi

            POSKUS=$((POSKUS + 1))
            sleep 30
          done
